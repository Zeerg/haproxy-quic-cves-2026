global
    limited-quic
    maxconn 100
    stats socket /tmp/haproxy.sock level admin

traces
    trace quic sink stderr level developer verbosity clean start now

defaults
    mode http
    timeout connect 5s
    timeout client 5s
    timeout server 5s

frontend quic_lab
    bind quic4@:8443 ssl crt /tmp/haproxy.pem alpn h3
    http-request return status 200 content-type text/plain string ok
